table:
  name: organization_monthly_usage
  schema: public
object_relationships:
  - name: organization
    using:
      manual_configuration:
        column_mapping:
          org_id: id
        insertion_order: null
        remote_table:
          name: organizations
          schema: public
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: editor
      allow_aggregations: true
  - role: owner
    permission:
      columns: '*'
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      allow_aggregations: true
  - role: user
    permission:
      columns:
        - org_id
        - org_name
        - usage_limit
        - month
        - total_workflow_runs
        - total_step_runs
        - static_usage_calls
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: viewer
      allow_aggregations: true
