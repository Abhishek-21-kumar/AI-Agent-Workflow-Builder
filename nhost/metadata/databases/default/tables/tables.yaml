- table:
    schema: public
    name: workflow_events
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  event_triggers:
    - name: on_workflow_event_created
      definition:
        enable_manual: true
        insert:
          columns: "*"
      webhook: "{{ACTION_BASE_URL}}/api/triggers/database-event"
      headers:
        - name: x-hasura-admin-secret
          value_from_env: NHOST_ADMIN_SECRET
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, event_name, payload, created_at]
        filter:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
        allow_aggregations: true
    - role: owner
      permission:
        columns: '*'
