table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
select_permissions:
  - role: editor
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: editor
      allow_aggregations: true
  - role: owner
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner
      allow_aggregations: true
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - workflow_step_id
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - started_at
        - completed_at
        - created_at
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      allow_aggregations: true
  - role: viewer
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: viewer
      allow_aggregations: true
